<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0208"/>
      <stop offset="100%" stop-color="#1a040c"/>
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8361a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#e8361a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8361a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width="40" height="40" rx="8" fill="url(#bg-grad)"/>
  <!-- Subtle inner glow -->
  <rect width="40" height="40" rx="8" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="20" cy="20" r="17" fill="none" stroke="url(#stroke-grad)" stroke-width="1.2" opacity="0.9"/>
  <!-- Triangle / A shape -->
  <path d="M8 27 L20 8 L32 27 Z" fill="none" stroke="url(#stroke-grad)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Center dot accent -->
  <circle cx="20" cy="22.5" r="2.2" fill="#e8361a"/>
  <!-- Tiny highlight on dot -->
  <circle cx="19.3" cy="21.8" r="0.65" fill="rgba(255,255,255,0.55)"/>
</svg>
